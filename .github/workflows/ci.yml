name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.85.0, 1.92.0]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - name: Verify
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
        run: sh scripts/verify.sh

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.85.0
      - name: Verify platform
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: sh scripts/verify.sh platform
      - name: Reporting benchmark (macOS arm64)
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: cargo bench --locked --bench reporting

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.85.0
      - name: Verify platform
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
          PYTHON: python
        run: sh scripts/verify.sh platform
