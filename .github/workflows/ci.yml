name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.85.0, 1.92.0]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - name: Verify
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
        run: sh scripts/verify.sh

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.85.0
      - name: Verify platform
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: sh scripts/verify.sh platform
      - name: Reporting benchmark (macOS arm64)
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: |
          timing_failure_marker='CODEXLENS_REPORTING_BENCHMARK_TIMING_FAILURE:'
          timing_failure_seen=false
          clean_runs=0
          for attempt in 1 2 3; do
            if output=$(cargo bench --locked --bench reporting 2>&1); then
              printf '%s\n' "${output}"
              if [ "${timing_failure_seen}" = true ]; then
                clean_runs=$((clean_runs + 1))
                if [ "${clean_runs}" -ge 2 ]; then
                  exit 0
                fi
              else
                exit 0
              fi
              continue
            else
              status=$?
              printf '%s\n' "${output}"
              case "${output}" in
                *"${timing_failure_marker}"*) ;;
                *) exit "${status}" ;;
              esac
              timing_failure_seen=true
              clean_runs=0
              echo "Reporting benchmark timing attempt ${attempt} failed; retrying for hosted-runner noise" >&2
            fi
          done
          exit 1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.85.0
      - name: Verify platform
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
          PYTHON: python
        run: sh scripts/verify.sh platform
